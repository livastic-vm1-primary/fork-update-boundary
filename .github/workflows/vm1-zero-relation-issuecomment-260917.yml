name: VM1 Zero Relation Issue Comment Provenance 20260917

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  provenance:
    if: ${{ github.event.issue.pull_request && startsWith(github.event.comment.body, 'VM1_ISSUE_COMMENT_ZERO_RELATION_260917') }}
    runs-on: ubuntu-latest
    env:
      MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
      MERGIFY_TEST_JOB_NAME: vm1-zero-relation-issuecomment-260917
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install current pytest-mergify
        run: |
          python -m pip install --disable-pip-version-check -q pytest pytest-mergify
          python - <<'PY'
          import importlib.metadata
          print('pytest-mergify-version=' + importlib.metadata.version('pytest-mergify'))
          PY
      - name: Print source provenance without secrets
        run: |
          echo "EVENT_NAME=$GITHUB_EVENT_NAME"
          echo "ACTOR=$GITHUB_ACTOR"
          echo "SHA=$GITHUB_SHA"
          echo "REF=$GITHUB_REF"
          python - <<'PY'
          import json, os
          e=json.load(open(os.environ['GITHUB_EVENT_PATH']))
          print('ISSUE_NUMBER=' + str(e.get('issue',{}).get('number')))
          print('ISSUE_AUTHOR=' + str(e.get('issue',{}).get('user',{}).get('login')))
          print('ISSUE_AUTHOR_ASSOCIATION=' + str(e.get('issue',{}).get('author_association')))
          print('COMMENT_USER=' + str(e.get('comment',{}).get('user',{}).get('login')))
          print('COMMENT_AUTHOR_ASSOCIATION=' + str(e.get('comment',{}).get('author_association')))
          print('PR_API_URL_PRESENT=' + str(bool(e.get('issue',{}).get('pull_request',{}).get('url'))))
          PY
      - name: Upload one deterministic failing test
        run: pytest -q tests/test_vm1_issue_comment_zero_relation.py

