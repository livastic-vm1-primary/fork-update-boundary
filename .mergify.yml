pull_request_rules:
  - name: VM1 low-priv trigger adds marker
    conditions:
      - author = livastic-vm1-secondary
      - sender = livastic-vm1-secondary
      - -label = vm1-sender-launder-260913
    actions:
      label:
        add:
          - vm1-sender-launder-260913

  - name: VM1 detect generated-event privilege laundering
    conditions:
      - label = vm1-sender-launder-260913
