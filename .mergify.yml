pull_request_rules:
  - name: AUTO_UPDATE_FORK_BOUNDARY
    conditions:
      - base = main
      - "#commits-behind > 0"
    actions:
      update:

  - name: VM1 bot-account primary credential control
    conditions:
      - base = vm1-botid-source-base-260915
      - title = VM1_BOTID_PRIMARY_CONTROL_260915
    actions:
      copy:
        branches:
          - vm1-botid-primary-control-target-260915
        bot_account: livastic-vm1-primary
        ignore_conflicts: true
        report_mode:
          - check
          - comment
