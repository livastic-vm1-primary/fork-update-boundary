merge_queue:
  mode: serial
  max_parallel_checks: 1

queue_rules:
  - name: vm1-largefork-guard
    merge_method: squash
    update_method: rebase
    batch_size: 1
    max_checks_retries: 0
    queue_conditions:
      - base = vm1-largefork-base-260918
      - check-success = vm1-largefork-gate

pull_request_rules:
  - name: VM1_LARGEFORK_TRUNCATION_GUARD_260918
    conditions:
      - base = vm1-largefork-base-260918
      - label = vm1-largefork-queue
    actions:
      queue:
        name: vm1-largefork-guard
