pull_request_rules:
  - name: VM1 B title trigger adds marker
    conditions:
      - author = livastic-vm1-secondary
      - title = VM1_SENDER_LAUNDER_260915
      - -label = vm1-sender-launder-260915
    actions:
      label:
        add:
          - vm1-sender-launder-260915

  - name: VM1 hosted copy preclaim canonicalization discriminator
    conditions:
      - title = VM1_COPY_PRECLAIM_CANON
      - label = vm1-copy-preclaim-trigger
    actions:
      copy:
        branches:
          - vm1-copy-canon-normal-260916
          - "vm1-copy-canon/%2e%2e/probe#safe"
