pull_request_rules:
  - name: VM1 B title trigger adds marker
    conditions:
      - author = livastic-vm1-secondary
      - title = VM1_SENDER_LAUNDER_260915
      - -label = vm1-sender-launder-260915
    actions:
      label:
        add:
          - vm1-sender-launder-260915

  - name: VM1 hosted backport preclaim canonicalization discriminator
    conditions:
      - title = VM1_BP_PRECLAIM_CANON
      - base = vm1-bp-origin-260916
      - label = vm1-bp-preclaim-trigger
    actions:
      backport:
        branches:
          - vm1-bp-canon-normal-260916
          - "vm1-bp-canon/%2e%2e/probe#safe"
